services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dalildz
      POSTGRES_USER: dalildz
      POSTGRES_PASSWORD: dalildz
    volumes:
      - dalildz-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalildz"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dalildz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dalildz:dalildz@db:5432/dalildz
      REDIS_URL: redis://redis:6379/0
      OCR_PROVIDER: none
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+psycopg://dalildz:dalildz@db:5432/dalildz
      REDIS_URL: redis://redis:6379/0
      OCR_PROVIDER: none
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  dalildz-db: {}
  dalildz-redis: {}
