services:
 db:
  image: postgres:17-alpine
  environment: {POSTGRES_DB: dalildz, POSTGRES_USER: dalildz, POSTGRES_PASSWORD: dalildz}
  volumes: [dalildz-db:/var/lib/postgresql/data]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U dalildz"], interval: 5s, timeout: 3s, retries: 10}
 backend:
  build: ./backend
  environment: {DATABASE_URL: postgresql+psycopg://dalildz:dalildz@db:5432/dalildz}
  depends_on: {db: {condition: service_healthy}}
  ports: ["8000:8000"]
 frontend:
  build: ./frontend
  depends_on: [backend]
  ports: ["3000:3000"]
volumes: {dalildz-db: {}}
