name: Bootstrap DalilDZ Compact
on:
  push:
    paths: ['.bootstrap/q*']
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: payload
        run: |
          ok=true
          for i in 00 01 02 03 04 05 06 07 08 09 10; do test -f ".bootstrap/q$i" || ok=false; done
          echo "complete=$ok" >> "$GITHUB_OUTPUT"
      - if: steps.payload.outputs.complete == 'true'
        run: |
          cat .bootstrap/q{00..10} | base64 -d > /tmp/dalildz.tar.xz
          echo "cbd091fe33b0d1e881e3c8e718ca1d047f79df13f8a17e7ff3d69bb6f8c91ea8  /tmp/dalildz.tar.xz" | sha256sum -c -
          tar -xJf /tmp/dalildz.tar.xz
          rm -rf .bootstrap .github/workflows/bootstrap.yml .github/workflows/bootstrap2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build DalilDZ v1.0 evidence engine"
          git push
