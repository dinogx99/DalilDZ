name: Bootstrap DalilDZ
on:
  push:
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for complete payload
        id: payload
        run: |
          ok=true
          for i in 00 01 02 03 04 05 06; do
            test -f ".bootstrap/part$i" || ok=false
          done
          echo "complete=$ok" >> "$GITHUB_OUTPUT"
      - name: Unpack repository
        if: steps.payload.outputs.complete == 'true'
        run: |
          cat .bootstrap/part{00..06} | base64 -d > /tmp/dalildz.tar.xz
          echo "cbd091fe33b0d1e881e3c8e718ca1d047f79df13f8a17e7ff3d69bb6f8c91ea8  /tmp/dalildz.tar.xz" | sha256sum -c -
          tar -xJf /tmp/dalildz.tar.xz
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit project
        if: steps.payload.outputs.complete == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build DalilDZ v1.0 evidence engine"
          git push
